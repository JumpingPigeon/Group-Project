<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HelpDesk Dashboard</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f6f7fb; }
    .nav { background: #111827; color: white; padding: 14px 20px; }
    .container { max-width: 900px; margin: 24px auto; padding: 0 16px; }
    .card { background: white; border-radius: 12px; padding: 18px; box-shadow: 0 2px 10px rgba(0,0,0,.06); }
    .muted { color: #6b7280; }
    .row { display: flex; gap: 12px; margin-top: 12px; flex-wrap: wrap; }
    .pill { background: #eef2ff; padding: 8px 10px; border-radius: 999px; font-size: 14px; }
    a { color: #2563eb; text-decoration: none; }
  </style>
</head>
<body>
  <div class="nav">
    <strong>NittanyAuction</strong> — HelpDesk
  </div>

  <div class="container">
    <div class="card">
      <h2>Welcome, HelpDesk</h2>

      {% if session.get('email') %}
        <p class="muted">Logged in as: <strong>{{ session.get('email') }}</strong></p>
      {% else %}
        <p class="muted">You are viewing the HelpDesk dashboard.</p>
      {% endif %}

      <div class="row">
        <div class="pill">User ID Change Requests</div>
        <div class="pill">Seller Upgrade Requests</div>
        <div class="pill">Category Requests</div>
      </div>

      <p style="margin-top: 14px;">
        <a href="/">Back to Home</a>
      </p>
    </div>
  </div>
</body>
</html>
