<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nittany Auction: Register</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">
    <style>
        body { background-color: #f8f9fa; }
        .register-box { width: 100%; max-width: 800px; margin: 50px auto; padding: 40px; background: #fff; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .section-title { color: #001e44; border-left: 4px solid #001e44; padding-left: 10px; margin: 25px 0 15px 0; font-size: 1.2rem; font-weight: bold; }
        .form-control { border-radius: 8px; }
        .btn-register { border-radius: 30px; background-color: #001e44; color: white; }
        .helpdesk-warning { display: none; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="register-box">
        <h2 class="text-center" style="color: #001e44; font-weight: 700;">User Registration</h2>
        <p class="text-center text-muted">Please fill in the details</p>

        <form method="POST" id="registerForm">
            <div class="section-title">Account Security</div>
            <div class="row">
                <div class="col-md-6 form-group">
                    <label>Email (User ID)</label>
                    <input type="email" name="email" class="form-control" placeholder="example@lsu.edu" required>
                </div>
                <div class="col-md-6 form-group">
                    <label>Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
            </div>

            <div class="section-title">User Role</div>
            <div class="form-group">
                <label>Register As</label>
                <select name="user_type" id="roleSelect" class="form-control" required>
                    <option value="">-- Select Role --</option>
                    <option value="bidder">Bidder</option>
                    <option value="seller">Seller</option>
                    <option value="helpdesk">Helpdesk</option>
                </select>
                <div id="helpdeskWarning" class="alert alert-danger helpdesk-warning">
                    Warning: HelpDesk accounts cannot be created externally. Please contact the administrator.
                </div>
            </div>

            <div id="sellerTypeSection" style="display:none;" class="form-group">
                <label>Seller Type</label>
                <div class="custom-control custom-radio">
                    <input type="radio" id="typeStudent" name="seller_sub_type" value="student" class="custom-control-input">
                    <label class="custom-control-label" for="typeStudent">Student</label>
                </div>
                <div class="custom-control custom-radio">
                    <input type="radio" id="typeVendor" name="seller_sub_type" value="vendor" class="custom-control-input">
                    <label class="custom-control-label" for="typeVendor">Local Vendor</label>
                </div>
            </div>

            <div id="personalInfo" style="display:none;">
                <div class="section-title">Personal Information</div>
                <div class="row">
                    <div class="col-md-4 form-group"><label>First Name</label><input type="text" name="firstname" class="form-control"></div>
                    <div class="col-md-4 form-group"><label>Last Name</label><input type="text" name="lastname" class="form-control"></div>
                    <div class="col-md-4 form-group"><label>Age</label><input type="number" name="age" class="form-control"></div>
                </div>
                <div class="form-group"><label>Major</label><input type="text" name="major" class="form-control" placeholder="e.g. Computer Science"></div>
            </div>

            <div id="vendorInfo" style="display:none;">
                <div class="section-title">Business Information</div>
                <div class="form-group"><label>Business Name</label><input type="text" name="business_name" class="form-control"></div>
                <div class="form-group"><label>Customer Service Phone</label><input type="text" name="business_phone" class="form-control"></div>
            </div>

            <div id="addressSection" style="display:none;">
                <div class="section-title">Address Details</div>
                <div class="row">
                    <div class="col-md-3 form-group"><label>Street Num</label><input type="text" name="street_num" class="form-control"></div>
                    <div class="col-md-6 form-group"><label>Street Name</label><input type="text" name="street_name" class="form-control"></div>
                    <div class="col-md-3 form-group"><label>Zipcode</label><input type="text" name="zipcode" class="form-control"></div>
                </div>
            </div>

            <div id="bankInfo" style="display:none;">
                <div class="section-title">Bank Information</div>
                <div class="row">
                    <div class="col-md-6 form-group"><label>Routing Number</label><input type="text" name="bank_routing" class="form-control"></div>
                    <div class="col-md-6 form-group"><label>Account Number</label><input type="text" name="bank_account" class="form-control"></div>
                </div>
            </div>

            <div id="cardInfo" style="display:none;">
                <div class="section-title">Payment Method (Credit Card)</div>
                <div class="form-group"><label>Card Number</label><input type="text" name="card_num" class="form-control"></div>
                <div class="row">
                    <div class="col-md-4 form-group"><label>Card Type</label><select name="card_type" class="form-control"><option>Visa</option><option>MasterCard</option><option>Amex</option></select></div>
                    <div class="col-md-3 form-group"><label>Exp Month</label><input type="number" name="exp_m" class="form-control" placeholder="MM"></div>
                    <div class="col-md-3 form-group"><label>Exp Year</label><input type="number" name="exp_y" class="form-control" placeholder="YYYY"></div>
                    <div class="col-md-2 form-group"><label>CVV</label><input type="text" name="cvv" class="form-control"></div>
                </div>
            </div>

            <div class="mt-4">
                <button type="submit" id="submitBtn" class="btn btn-register btn-block py-2">Complete Registration</button>
                <a href="/login" class="btn btn-link btn-block">Already have an account? Login</a>
            </div>
        </form>
    </div>
</div>

<script>
    const roleSelect = document.getElementById('roleSelect');
    const sellerTypeRadios = document.getElementsByName('seller_sub_type');
    const submitBtn = document.getElementById('submitBtn');

    function updateForm() {
        const role = roleSelect.value;
        let sellerType = "";
        for (const rb of sellerTypeRadios) { if (rb.checked) sellerType = rb.value; }

        // Reset all sections
        document.getElementById('helpdeskWarning').style.display = 'none';
        document.getElementById('sellerTypeSection').style.display = 'none';
        document.getElementById('personalInfo').style.display = 'none';
        document.getElementById('vendorInfo').style.display = 'none';
        document.getElementById('bankInfo').style.display = 'none';
        document.getElementById('cardInfo').style.display = 'none';
        document.getElementById('addressSection').style.display = 'none';
        submitBtn.disabled = false;

        <!-- We only show certain sections based on the selected role and seller type -->
        if (role === 'helpdesk') {
            document.getElementById('helpdeskWarning').style.display = 'block';
            submitBtn.disabled = true;
        } else if (role === 'bidder') {
            document.getElementById('personalInfo').style.display = 'block';
            document.getElementById('addressSection').style.display = 'block';
            document.getElementById('cardInfo').style.display = 'block';
        } else if (role === 'seller') {
            document.getElementById('sellerTypeSection').style.display = 'block';
            document.getElementById('addressSection').style.display = 'block';
            document.getElementById('bankInfo').style.display = 'block';
            
            if (sellerType === 'student') {
                document.getElementById('personalInfo').style.display = 'block';
                document.getElementById('cardInfo').style.display = 'block';
            } else if (sellerType === 'vendor') {
                document.getElementById('vendorInfo').style.display = 'block';
            }
        }
    }

    roleSelect.addEventListener('change', updateForm);
    sellerTypeRadios.forEach(r => r.addEventListener('change', updateForm));
    
</script>
</body>
</html>
