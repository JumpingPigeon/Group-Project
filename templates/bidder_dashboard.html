<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bidder Dashboard</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; }
    .nav { background: #111827; color: white; padding: 14px 20px; }
    .container { max-width: 900px; margin: 24px auto; padding: 0 16px; }
    .card { background: white; border-radius: 12px; padding: 18px; box-shadow: 0 2px 10px rgba(0,0,0,.06); }
    .muted { color: #6b7280; }
    .row { display: flex; gap: 12px; margin-top: 12px; flex-wrap: wrap; }
    .pill { background: #eef2ff; padding: 8px 10px; border-radius: 999px; font-size: 14px; }
    a { color: #2563eb; text-decoration: none; }
  </style>
</head>
<body>
  <div class="nav">
    <strong>NittanyAuction</strong> — Bidder
  </div>
  <div class="container">
    <div class="card">
      <h2>Welcome, Bidder</h2>
      {% if email %}
        <p class="muted">Logged in as: <strong>{{ email }}</strong></p>
      {% else %}
        <p class="muted">You are viewing the bidder dashboard.</p>
      {% endif %}
      <div class="row">
        <a class="pill" href="{{ url_for('categories') }}" style="text-decoration:none;">Browse Listings</a>
        <div class="pill">My Bids</div>
        <div class="pill">Watchlist (Optional)</div>
      </div>
      <p style="margin-top: 14px;">
        <a href="/">Back to Home</a> |
        <a href="{{ url_for('logout') }}">Log out</a>
      </p>
    </div>
  </div>
</body>
</html>
