<!DOCTYPE html>
<html lang="en">
    <head>
        
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <style>
            body{
                font-family: Arial, Helvetica, sans-serif;
                margin: 0;
            }

            #header{
                background-color: cadetblue;
                height: 40px;
               
            }
            a{
                text-decoration: none;
            }
            #navigator{
                margin-top: 40px;
                background-color:#f8f9fa;
                width: 80px;
                height: 100%;
                position: fixed;
                left: 0;
                font-size: 10px;
                margin-right: 0%;
            }
            #navigator ul {
                list-style: none;     
                padding: 0;
                margin: 0;
            }

            #navigator li {
                padding: 10px;
            }

            #navigator a {
                color: black;
                display: block;
            }

            #navigator a:hover {
                background-color: #e9ecef;
            }

            #main-page{
                margin-left: 90px;
                margin-top: 50px;
                
            }
        </style>
    </head>
    <body>
        <div id="header" class="fixed-top w-100 text-white align-items-center d-flex">
            <div class="px-3" style="font-size: 13px;">Nittany Auction - {{session.user_email}}</div>

        </div>
        
        <div class="d-flex" style="padding: 0%;">
            <div id="navigator" style="color: black;">
                <ul>
                    <li><a href="">Profile</a></li>
                    <li><a href="">Sell</a></li>
                    <li><a href="">My Product</a></li>
                </ul>
            </div>
            <div id="main-page" >
                <div >Welcome to Nittany Auction, Seller.</div>
                <BR>
                <form action="/logout" method="get">
                    <button type="submit" class="btn btn-danger">
                        Logout
                    </button>
                </form>
            </div>
        </div>




        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    </body>

</html>
