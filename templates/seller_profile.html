<!DOCTYPE html>
<html lang="en">
    <head>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
      <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
        <style>
            .option{
                font-size: 14px;
                margin-left: 0px;
                font-family:"Rubik", sans-serif;
                width:140px;
                text-align: center;
                height:50px;
                display:flex;
                justify-content:center;
                border-left:1px solid white;
                border-right:1px solid white;
              
            }
            .option:hover{
              background-color:#0D6EFD;
              transition:1s;
              transform: scale(1.2);
            }
            body{
                font-family: Arial, Helvetica, sans-serif;
                margin: 0;
                background: #f6f7fb;
            }

            #header{
                background-color: #111827;
                height: 50px;
                
            }
            a{
                text-decoration: none;
            }

            #header a {
                color: white;
                display: block;
            }


            #main-page{
                margin-left: 90px;
                margin-top: 50px;
                
            }
            .container { 
                max-width: 900px; 
                margin: 24px auto; 
                padding: 0 16px; }
            .card{
                background: white; 
                border-radius: 12px; 
                padding: 18px; 
                box-shadow: 0 2px 10px rgba(0,0,0,.06); 
            }
            
        </style>
    </head>
    <body>
        <div id="header" class="fixed-top w-100 text-white align-items-center d-flex" style="padding: 14px 20px;">
            <div class="px-3" style="font-size: 18px;font-family:Oswald, sans-serif;">Nittany Auction - Seller</div>
            <div class="option " style="margin-left:150px;"><a  style="margin:auto;" href="/seller_profile">Profile</a></div>
            <div class="option" style="margin-right:150px;"><a style="margin:auto;" href="/seller_auction">My auction</a></div>
            <div class="" style="margin-left:auto;">
                    <button style="Rubik, sans-serif; height: 30px;font-size: 13px;" type="submit" class="btn btn-danger" data-bs-toggle="modal" data-bs-target="#login_confirm">
                        Logout
                    </button>
                
            </div>
        </div>
        <div class="container">
            <div class="d-flex card  " style="margin-top:100px;">
            
                <!-- this form send request change ID -->
            <form method="POST" action="/request_change_email">
                <div class="mb-3">
                    <label class="form-label">New Email</label>
                    <input type="email" class="form-control" name="new_email" required>
                </div>

                <button type="submit" class="btn btn-primary w-50">
                    Request Change ID
                </button>
            </form>
            <!-- this form update password -->
            <br>
            <form method="POST" action="/update_password">
                <!-- Password -->
                <div class="mb-3">
                    <label class="form-label">New Password</label>
                    <input type="password" class="form-control" name="password" placeholder="Enter new password" required>
                </div>

                <button type="submit" class="btn btn-primary w-50">
                    Update Password
                </button>

            </form>
            <br>
            <form method="POST" action="/update_bank_info">

                <div class="mb-3">
                    <label class="form-label">Bank Routing Number</label>
                    <input type="text" class="form-control" name="routing"
                        placeholder="e.g. 0000-0000-0" >
                </div>

                <div class="mb-3">
                    <label class="form-label">Bank Account Number</label>
                    <input type="text" class="form-control" name="account"
                        placeholder="Enter account number" >
                </div>

                <button type="submit" class="btn btn-primary w-50">
                    Update Bank Info
                </button>

            </form>                
                






                
            
        </div>
        </div>
        <div class="modal" tabindex="-1" id="login_confirm">
<div class="modal-dialog">
<div class="modal-content">
<div class="modal-header">
  <h5 class="modal-title">Logout</h5>
  <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
</div>
<div class="modal-body">
  <p>Are you sure you want to logout?</p>
</div>
<div class="modal-footer">
  <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">No</button>
  <form action="/logout" method="get">
    <button type="submit" class="btn btn-primary">Yes</button>
    
  </form>
  
</div>
</div>
</div>
</div>




        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    </body>

</html>
